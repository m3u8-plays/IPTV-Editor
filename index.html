<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV M3U Playlist Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-2 flex items-center justify-center gap-3">
                <i class="fa-solid fa-tv text-indigo-400"></i> IPTV M3U Playlist Generator
            </h1>
            <p class="text-slate-400">Create, manage, and export custom M3U channel lists with extended `#EXTINF` tags.</p>
        </header>

        <!-- Channel Entry Form -->
        <div class="bg-slate-800 rounded-xl p-6 shadow-xl mb-8 border border-slate-700">
            <h2 id="form-title" class="text-xl font-semibold mb-4 text-indigo-300 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Add New Channel
            </h2>
            
            <form id="channel-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <input type="hidden" id="edit-index" value="">
                
                <div class="flex flex-col">
                    <label class="text-sm text-slate-300 mb-1 font-medium">Channel Name *</label>
                    <input type="text" id="tv-name" required placeholder="E.g., BBC One HD" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-sm text-slate-300 mb-1 font-medium">Stream URL *</label>
                    <input type="url" id="tv-url" required placeholder="E.g., http://streaming.com/live/playlist.m3u8" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-sm text-slate-300 mb-1 font-medium">Group Name (group-title)</label>
                    <input type="text" id="tv-group" placeholder="E.g., Sports, News, Movies" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-sm text-slate-300 mb-1 font-medium">EPG ID (tvg-id)</label>
                    <input type="text" id="tv-id" placeholder="E.g., bbcone.uk" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-sm text-slate-300 mb-1 font-medium">Logo URL (tvg-logo)</label>
                    <input type="url" id="tv-logo" placeholder="E.g., https://i.imgur.com/logo.png" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex flex-col">
                    <label class="text-sm text-slate-300 mb-1 font-medium">Channel Number (tvg-chno)</label>
                    <input type="number" id="tv-chno" placeholder="E.g., 101" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="md:col-span-2 lg:col-span-3 flex justify-end gap-3 mt-2">
                    <button type="button" id="cancel-edit" onclick="resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded text-sm font-medium transition">Cancel</button>
                    <button type="submit" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded text-sm font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-save"></i> Save Channel
                    </button>
                </div>
            </form>
        </div>

        <!-- Channel Table Section -->
        <div class="bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-semibold text-indigo-300 flex items-center gap-2">
                    <i class="fa-solid fa-list"></i> Saved Channels (<span id="channel-count">0</span>)
                </h2>
                <div class="flex gap-3 w-full md:w-auto">
                    <button onclick="exportM3U()" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded text-sm font-medium transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> Export M3U
                    </button>
                    <button onclick="clearAll()" class="bg-rose-600/80 hover:bg-rose-600 text-white px-4 py-2 rounded text-sm font-medium transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-3">#</th>
                            <th class="p-3">Logo</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Group</th>
                            <th class="p-3">URL</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="channels-table-body" class="divide-y divide-slate-700/50 text-sm">
                        <tr>
                            <td colspan="6" class="text-center py-6 text-slate-500">No channels added yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let channels = JSON.parse(localStorage.getItem('iptv_channels')) || [];

        const form = document.getElementById('channel-form');
        const tableBody = document.getElementById('channels-table-body');
        const channelCount = document.getElementById('channel-count');
        const editIndexInput = document.getElementById('edit-index');
        const submitBtn = document.getElementById('submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit');
        const formTitle = document.getElementById('form-title');

        // Initial render
        renderTable();

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const channel = {
                name: document.getElementById('tv-name').value.trim(),
                url: document.getElementById('tv-url').value.trim(),
                group: document.getElementById('tv-group').value.trim(),
                id: document.getElementById('tv-id').value.trim(),
                logo: document.getElementById('tv-logo').value.trim(),
                chno: document.getElementById('tv-chno').value.trim()
            };

            const editIndex = editIndexInput.value;

            if (editIndex === "") {
                channels.push(channel);
            } else {
                channels[editIndex] = channel;
                resetForm();
            }

            saveAndRender();
            form.reset();
        });

        function renderTable() {
            channelCount.textContent = channels.length;
            if (channels.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No channels added yet.</td></tr>`;
                return;
            }

            tableBody.innerHTML = '';
            channels.forEach((ch, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition';
                tr.innerHTML = `
                    <td class="p-3 font-mono text-slate-400">${ch.chno || (index + 1)}</td>
                    <td class="p-3">
                        ${ch.logo ? `<img src="${ch.logo}" alt="logo" class="w-8 h-8 object-contain bg-slate-900 rounded p-1" onerror="this.src='https://via.placeholder.com/32?text=Error'">` : '<span class="text-slate-600 text-xs">No logo</span>'}
                    </td>
                    <td class="p-3 font-medium text-white">${ch.name}</td>
                    <td class="p-3"><span class="bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded text-xs">${ch.group || 'General'}</span></td>
                    <td class="p-3 font-mono text-xs text-slate-400 truncate max-w-xs" title="${ch.url}">${ch.url}</td>
                    <td class="p-3 text-center whitespace-nowrap">
                        <button onclick="editChannel(${index})" class="text-indigo-400 hover:text-indigo-300 p-1.5 transition" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteChannel(${index})" class="text-rose-400 hover:text-rose-300 p-1.5 transition ml-2" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function saveAndRender() {
            localStorage.setItem('iptv_channels', JSON.stringify(channels));
            renderTable();
        }

        function editChannel(index) {
            const ch = channels[index];
            document.getElementById('tv-name').value = ch.name;
            document.getElementById('tv-url').value = ch.url;
            document.getElementById('tv-group').value = ch.group;
            document.getElementById('tv-id').value = ch.id;
            document.getElementById('tv-logo').value = ch.logo;
            document.getElementById('tv-chno').value = ch.chno;
            
            editIndexInput.value = index;
            submitBtn.innerHTML = '<i class="fa-solid fa-sync"></i> Update Channel';
            formTitle.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit Channel';
            cancelEditBtn.classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            form.reset();
            editIndexInput.value = "";
            submitBtn.innerHTML = '<i class="fa-solid fa-save"></i> Save Channel';
            formTitle.innerHTML = '<i class="fa-solid fa-plus-circle"></i> Add New Channel';
            cancelEditBtn.classList.add('hidden');
        }

        function deleteChannel(index) {
            if (confirm("Are you sure you want to delete this channel?")) {
                channels.splice(index, 1);
                saveAndRender();
            }
        }

        function clearAll() {
            if (confirm("Are you sure you want to remove all channels from the list?")) {
                channels = [];
                saveAndRender();
                resetForm();
            }
        }

        function exportM3U() {
            if (channels.length === 0) {
                alert("There are no channels to export.");
                return;
            }

            let m3uContent = "#EXTM3U\n";

            channels.forEach(ch => {
                let attrs = [];
                if (ch.id) attrs.push(`tvg-id="${ch.id}"`);
                if (ch.logo) attrs.push(`tvg-logo="${ch.logo}"`);
                if (ch.group) attrs.push(`group-title="${ch.group}"`);
                if (ch.chno) attrs.push(`tvg-chno="${ch.chno}"`);

                let attrString = attrs.length > 0 ? " " + attrs.join(" ") : "";
                
                m3uContent += `#EXTINF:-1${attrString},${ch.name}\n`;
                m3uContent += `${ch.url}\n`;
            });

            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'playlist.m3u';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
